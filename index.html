<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>유메키보고등학교</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css">
<link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>

<div class="wrap">

  <div class="header-row" id="headerHome">
    <div class="logo">로고</div>
    <div class="title-bar">
      <h1>유메키보고등학교</h1>
      <span>YUMEKIBO HIGH SCHOOL</span>
    </div>
  </div>

  <div class="nav-row" id="navRow">
    <button class="nav-btn" data-page="group">GROUP</button>
    <button class="nav-btn" data-page="class">CLASS</button>
    <button class="nav-btn" data-page="club">CLUB</button>
    <button class="nav-btn" data-page="counsel">학생회</button>
    <button class="nav-btn" data-page="agency">기숙사</button>
    <button class="nav-btn" data-page="etc">ETC</button>
  </div>

  <div class="tool-row">
    <button type="button" class="text-btn" id="addCharBtn">캐릭터 추가</button>
    <button type="button" class="text-btn" id="settingsBtn">저장 설정</button>
  </div>

  <!-- ================= MAIN PAGE ================= -->
  <div class="page active" id="page-main">
    <div class="main-grid">
      <div class="carousel">
        <div class="carousel-row">
          <button class="carousel-arrow" id="bannerPrev">&#8249;</button>
          <div class="carousel-stage" id="carouselStage"></div>
          <button class="carousel-arrow" id="bannerNext">&#8250;</button>
        </div>
        <div class="carousel-ticks" id="carouselTicks"></div>
      </div>

      <div class="side-col">
        <a class="link-row" href="https://youtube.com/@ymkbhighschool" target="_blank" rel="noopener">
          <div class="icon-box yt">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M21.6 7.2s-.2-1.5-.8-2.1c-.8-.8-1.7-.8-2.1-.9C15.9 4 12 4 12 4s-3.9 0-6.7.2c-.4 0-1.3.1-2.1.9-.6.6-.8 2.1-.8 2.1S2.2 9 2.2 10.7v1.6c0 1.7.2 3.5.2 3.5s.2 1.5.8 2.1c.8.8 1.9.8 2.4.9C7.5 19 12 19 12 19s3.9 0 6.7-.2c.4 0 1.3-.1 2.1-.9.6-.6.8-2.1.8-2.1s.2-1.7.2-3.5v-1.6c0-1.7-.2-3.5-.2-3.5zM9.9 14.6V8.9l5.4 2.9-5.4 2.8z"/></svg>
          </div>
          <span>YouTube</span>
        </a>
        <a class="link-row" href="https://soundcloud.com/ymkbofficial" target="_blank" rel="noopener">
          <div class="icon-box sc">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M2 15.5c0 1.9 1.6 3.5 3.5 3.5H18c2.2 0 4-1.8 4-4 0-1.9-1.4-3.5-3.2-3.9-.3-2.8-2.6-5-5.5-5-2 0-3.7 1.1-4.6 2.7-.2 0-.3-.1-.5-.1C6 8.7 4.4 10.2 4.2 12.1 2.9 12.5 2 13.9 2 15.5z"/></svg>
          </div>
          <span>Soundcloud</span>
        </a>
      </div>
    </div>
  </div>

  <!-- ================= GROUP LIST PAGE ================= -->
  <div class="page" id="page-group">
    <a class="back-link" data-page="main">&#8592; 메인으로</a>
    <div class="group-head">
      <h2>GROUP</h2>
      <span id="groupCountLabel"></span>
    </div>
    <div class="gallery" id="groupGallery"></div>
  </div>

  <!-- ================= PLACEHOLDER PAGES ================= -->
  <div class="page" id="page-class">
    <a class="back-link" data-page="main">&#8592; 메인으로</a>
    <h2 class="class-page-title">CLASS</h2>
    <div id="classList"></div>
  </div>
  <div class="page" id="page-club">
    <a class="back-link" data-page="main">&#8592; 메인으로</a>
    <div class="placeholder"><h2>CLUB</h2><p>동아리 페이지는 준비 중입니다.</p></div>
  </div>
  <div class="page" id="page-counsel">
    <a class="back-link" data-page="main">&#8592; 메인으로</a>
    <div class="placeholder"><h2>학생회</h2><p>학생회 페이지는 준비 중입니다.</p></div>
  </div>
  <div class="page" id="page-agency">
    <a class="back-link" data-page="main">&#8592; 메인으로</a>
    <div class="placeholder"><h2>기숙사</h2><p>기숙사 페이지는 준비 중입니다.</p></div>
  </div>
  <div class="page" id="page-etc">
    <a class="back-link" data-page="main">&#8592; 메인으로</a>
    <div class="placeholder"><h2>ETC</h2><p>기타 페이지는 준비 중입니다.</p></div>
  </div>

  <footer>© ymkb high school</footer>
</div>

<!-- ================= GROUP DETAIL MODAL ================= -->
<div class="modal-overlay" id="groupModal">
  <div class="modal-box">
    <button class="modal-close" id="groupModalClose">&times;</button>
    <h2 class="gd-title" id="gdTitle"></h2>
    <div class="gd-tags" id="gdTags"></div>
    <p class="gd-intro" id="gdIntro"></p>

    <hr class="soft-divider">

    <div class="section-label">
      <h3>소속 멤버</h3>
    </div>
    <div class="char-gallery" id="gdCharGallery"></div>

    <hr class="soft-divider">

    <div class="section-label">
      <h3>매니저</h3>
    </div>
    <div class="char-gallery" id="gdManagerGallery"></div>
  </div>
</div>

<!-- ================= CLASS DETAIL MODAL ================= -->
<div class="modal-overlay" id="classModal">
  <div class="modal-box">
    <button class="modal-close" id="classModalClose">&times;</button>
    <h2 class="gd-title" id="clTitle"></h2>
    <div class="gd-tags" id="clTeacherTag"></div>

    <hr class="soft-divider">

    <div class="section-label">
      <h3>학생 명단</h3>
    </div>
    <div class="char-gallery cols-5" id="clGallery"></div>
  </div>
</div>

<!-- ================= CHARACTER PROFILE MODAL (stacked) ================= -->
<div class="modal-overlay layer2" id="profileModal">
  <div class="modal-box">
    <button class="modal-close" id="profileModalClose">&times;</button>
    <div class="profile-body" id="profileBody"></div>
  </div>
</div>

<!-- ================= FORM / SETTINGS / CROP MODALS ================= -->
<div class="modal-overlay layer3" id="formModal">
  <div class="modal-box">
    <button class="modal-close" id="formClose">&times;</button>
    <div id="formBody"></div>
  </div>
</div>
<div class="modal-overlay layer3" id="settingsModal">
  <div class="modal-box narrow">
    <button class="modal-close" id="settingsClose">&times;</button>
    <div id="settingsBody"></div>
  </div>
</div>
<div class="modal-overlay layer4" id="cropModal">
  <div class="modal-box narrow">
    <button class="modal-close" id="cropClose">&times;</button>
    <h2 class="form-title">이미지 자르기</h2>
    <p class="form-hint">휠이나 손가락으로 확대하고, 드래그해서 위치를 맞춰 주세요.</p>
    <div class="crop-container"><img id="cropImage" alt=""></div>
    <div class="crop-controls">
      <button type="button" class="text-btn" id="cropZoomIn">확대</button>
      <button type="button" class="text-btn" id="cropZoomOut">축소</button>
      <button type="button" class="text-btn" id="cropRotate">회전</button>
      <button type="button" class="text-btn" id="cropReset">초기화</button>
    </div>
    <div class="form-actions">
      <button type="button" class="text-btn" id="cropCancel">취소</button>
      <button type="button" class="form-submit" id="cropApply">적용</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>
<script src="js/app.js?v=2"></script>
</body>
</html>
